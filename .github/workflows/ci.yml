name: 🚀 CI/CD — GUIDESOFT.WEB Enterprise AI Agent OS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Frontend Lint & Type Check
  # ──────────────────────────────────────────────────────────────
  frontend-lint:
    name: 🔍 Frontend Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:frontend || true

      - name: Run Svelte Type Check
        run: npm run check || true

  # ──────────────────────────────────────────────────────────────
  # 2. Frontend Unit Tests
  # ──────────────────────────────────────────────────────────────
  frontend-tests:
    name: 🧪 Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:frontend

  # ──────────────────────────────────────────────────────────────
  # 3. Backend Lint & Tests
  # ──────────────────────────────────────────────────────────────
  backend-tests:
    name: ⚙️ Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install Backend Dependencies
        working-directory: backend
        run: uv pip install --system -e ".[dev]" || pip install -r requirements.txt

      - name: Run Backend Linting (Ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check open_webui/ --ignore E501 || true

      - name: Test Backend Imports
        working-directory: backend
        env:
          WEBUI_SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite:///./test.db
        run: |
          python -c "from open_webui.routers import agents, providers; print('✅ New routers import OK')"

  # ──────────────────────────────────────────────────────────────
  # 4. Build Frontend
  # ──────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build (skip pyodide fetch in CI)
        run: npx vite build
        env:
          CI: true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 5. E2E Tests with Playwright
  # ──────────────────────────────────────────────────────────────
  e2e-tests:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test test/e2e/landing.spec.ts --project=chromium
        env:
          BASE_URL: http://localhost:5173
          CI: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 6. Security Scan
  # ──────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Audit npm Dependencies
        run: npm audit --audit-level=high || true

      - name: Check for Hardcoded Secrets
        run: |
          if grep -rn "api_key\s*=\s*['\"]sk-" src/ --include="*.ts" --include="*.svelte" 2>/dev/null; then
            echo "❌ Potential hardcoded API key found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  # ──────────────────────────────────────────────────────────────
  # 7. Deploy to Vercel (Production)
  # ──────────────────────────────────────────────────────────────
  deploy-production:
    name: 🌐 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ──────────────────────────────────────────────────────────────
  # 8. Deploy Backend to Railway/Render
  # ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚂 Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Build Docker Image
        if: env.DOCKER_USERNAME != ''
        run: |
          docker build -t guidesoft-web:${{ github.sha }} .
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag guidesoft-web:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/guidesoft-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/guidesoft-web:latest
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

  # ──────────────────────────────────────────────────────────────
  # 9. Notify on Success/Failure
  # ──────────────────────────────────────────────────────────────
  notify:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    steps:
      - name: Success Notification
        if: needs.deploy-production.result == 'success'
        run: |
          echo "🎉 Deployment successful!"
          echo "URL: https://open-webui-tawny-eta.vercel.app"

      - name: Failure Notification  
        if: needs.deploy-production.result == 'failure'
        run: |
          echo "❌ Deployment failed — check logs above"
          exit 1
